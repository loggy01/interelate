[build-system]
requires = ['setuptools>=77.0.3']
build-backend = 'setuptools.build_meta'

[project]
name = 'interelate'
description = 'Relating genomic interval datasets through comparative, distance-aware overlap analysis.'
keywords = ['bioinformatics', 'genomic intervals', 'relationship', 'comparative', 'distance-aware', 'overlap']
version = '1.0.0.post1'
authors = [{name = 'Aaron Mamane-Logsdon', email = 'aaron.logsdon19@imperial.ac.uk'}]
maintainers = [{name = 'Aaron Mamane-Logsdon', email = 'aaron.logsdon19@imperial.ac.uk'}]
readme = 'README.md'
license = 'GPL-3.0-or-later'
license-files = ['LICENSE']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = '>=3.12'
dependencies = [
    "absl-py>=2.0.0",
    "scipy>=1.15.0",
    "pyranges1>=1.3.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = 'https://github.com/loggy01/interelate'

[project.scripts]
interelate = 'interelate.cli:cli'

[tool.setuptools]
packages = ['interelate']
